name: Generate Rclone Config
on: workflow_dispatch

jobs:
  auth:
    runs-on: ubuntu-latest
    steps:
      - name: Install Rclone
        run: sudo apt update && sudo apt install -y rclone

      - name: Start Web Auth
        run: |
          echo "Run this: rclone config will ask for login"
          rclone authorize "drive"
