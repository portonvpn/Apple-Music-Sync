name: Apple Music to GDrive Sync

on:
  schedule:
    - cron: '0 */6 * * *'  # Runs automatically every 6 hours
  workflow_dispatch:       # Allows manual triggers

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg rclone
          pip install --upgrade yt-dlp

      - name: Restore Rclone Config
        env:
          RCLONE_CONF_DATA: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONF_DATA" > ~/.config/rclone/rclone.conf

      - name: Pull Existing Music from Google Drive
        run: |
          mkdir -p music_library
          rclone copy "gdrive:Music/AppleMusic" ./music_library --progress || true

      - name: Run Scraper & Downloader
        env:
          APPLE_MUSIC_PLAYLIST_URL: ${{ secrets.APPLE_MUSIC_PLAYLIST_URL }}
        run: |
          python sync.py

      - name: Sync Library to Google Drive
        run: |
          rclone sync ./music_library "gdrive:Music/AppleMusic" --progress
