name: Apple Music to GDrive Sync

on:
  schedule:
    - cron: '0 */6 * * *'  # Runs automatically every 6 hours
  workflow_dispatch:       # Allows you to click "Run workflow" manually anytime

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y ffmpeg rclone
          pip install yt-dlp

      - name: Restore Rclone Config
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG_BASE64 }}" | base64 -d > ~/.config/rclone/rclone.conf

      - name: Pull Existing Music from Google Drive
        run: |
          mkdir -p music_library
          # Download whatever is already in Drive so yt-dlp doesn't re-download them
          rclone copy "gdrive:Music/AppleMusic" ./music_library --progress || true

      - name: Run Scraper & Downloader
        env:
          APPLE_MUSIC_PLAYLIST_URL: ${{ secrets.APPLE_MUSIC_PLAYLIST_URL }}
        run: |
          python sync.py

      - name: Sync Library to Google Drive
        run: |
          # 'sync' copies new downloads and purges any songs removed from the playlist
          rclone sync ./music_library "gdrive:Music/AppleMusic" --progress
